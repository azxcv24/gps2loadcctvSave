# 사용법: config.example.toml 을 config.toml 로 복사해 고친 뒤
#   GPS2CCTV_ITS_API_KEY=발급받은키 docker compose up -d --build
# 클립 보기:  docker compose exec gps2cctv gps2cctv --config /config/config.toml clips list
# 클립 꺼내기: docker compose cp gps2cctv:/data/clips ./clips
services:
  gps2cctv:
    build: .
    restart: unless-stopped
    ports:
      - "5055:5055"   # Traccar 앱이 위치를 보내는 포트
    environment:
      - GPS2CCTV_ITS_API_KEY=${GPS2CCTV_ITS_API_KEY:-}
      - TZ=Asia/Seoul
    volumes:
      # config.toml 을 먼저 만드세요(없으면 Docker가 같은 이름의 폴더를 만들어 시작에 실패합니다).
      # 컨테이너는 uid 1000 으로 실행되므로 파일을 0600 으로 두려면 소유자도 uid 1000 이어야 합니다.
      - ./config.toml:/config/config.toml:ro
      # [[camera_files]] 를 쓰면 그 파일도 같은 폴더에 마운트하세요. 예:
      # - ./my_cameras.json:/config/my_cameras.json:ro
      - gps2cctv-data:/data

volumes:
  gps2cctv-data:
