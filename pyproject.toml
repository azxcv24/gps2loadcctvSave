[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps2cctv"
version = "0.1.0"
description = "GPS 기반 사고 증거 보존 및 공식 CCTV 보존 요청 보조 도구 (연구용)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gps2cctv = "gps2cctv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ISC"]
# 한글은 화면 폭 2칸으로 계산되어 문자열 줄이 길게 잡히므로, 줄 길이는 formatter에 맡긴다.
ignore = ["E501"]
